[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seedband2-toolchain_failure_localization_dedup"
version = "0.1.0"
description = "对内容做归一化与分片比对，找出文生视频工程师·多轮工具链的失败定位上的重复项并按相似度归并"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "seedband2" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://seedband2.github.io"
Repository = "https://github.com/seedband2/toolchain_failure_localization_dedup"
Issues = "https://github.com/seedband2/toolchain_failure_localization_dedup/issues"

[project.scripts]
toolchain_failure_localization_dedup = "toolchain_failure_localization_dedup:main"

[tool.setuptools]
py-modules = ["toolchain_failure_localization_dedup"]
